<svg xmlns="http://www.w3.org/2000/svg" width="860" height="700" viewBox="0 0 860 700" role="img" aria-label="Moujan Mirjalili's GitHub profile" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .win { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    text { font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", Consolas, "Courier New", monospace; font-size: 15px; dominant-baseline: middle; }
    .cmd  { fill: #58a6ff; }
    .out  { fill: #c9d1d9; }
    .acc  { fill: #3fb950; }
    .dim  { fill: #8b949e; }
    .title { fill: #8b949e; font-size: 13px; }
    .badge { fill: #ffa657; font-size: 13px; }
    .line { animation: fadein 0.35s ease both; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .cursor { animation: blink 1.05s steps(2, start) infinite; }
    @keyframes blink { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; }
      .cursor { animation: none; }
    }
  </style>

  <rect width="860" height="700" fill="#0d1117"/>
  <rect x="12" y="12" width="836" height="676" rx="10" class="win"/>

  <circle cx="40"  cy="44" r="6.5" fill="#ff5f57"/>
  <circle cx="62"  cy="44" r="6.5" fill="#febc2e"/>
  <circle cx="84"  cy="44" r="6.5" fill="#28c840"/>
  <text x="430" y="44" class="title" text-anchor="middle">moujan@goettingen — zsh — 86×26</text>
  <text x="818" y="44" class="badge" text-anchor="end">🌶️</text>

